name: gitops-validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.4'
      - uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.5.0'
      - name: Render manifests
        run: kustomize build apps/demo > /tmp/rendered.yaml
      - name: Basic YAML validation
        run: kubectl apply --dry-run=client -f /tmp/rendered.yaml
